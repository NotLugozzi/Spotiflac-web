services:
  spotiflac-web:
    build: ./src
    image: spotiflac-web-local
    container_name: spotiflac-web
    restart: unless-stopped
    ports:
      # Exposing the web UI on port 5900 (Accessible on LAN)
      - "5900:8080"
    env_file:
      - .env
    init: true
    # Headless Chromium (Turnstile solver for tidal-web) needs these
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined
    volumes:
      # Database persistence
      - ./data:/app/data
      # Your downloads directory (where files arrive before you move them to Plex)
      - ./downloads:/app/downloads
      # Persist SpotiFLAC cached sessions/grants
      - ./data/spotiflac_home:/home/spotiflac/.spotiflac
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        # 5 GB total (50 x 100 MB), oldest file dropped first
        max-size: "100m"
        max-file: "50"
